[project]
name = "findit"
version = "0.1.0"
description = "Geo + Census helpers for locating affordable housing in SoCal"
requires-python = ">=3.11,<3.14"
dependencies = [
    "folium>=0.17",
    "geopandas>=1.0",
    "lightgbm>=4.3",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "pyogrio>=0.9",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "scikit-learn>=1.5",
    "shapely>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["findit"]
